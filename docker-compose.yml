services:
  postgres:
    image: postgres:16.4-alpine
    container_name: delta-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: delta
      POSTGRES_PASSWORD: delta_secret
      POSTGRES_DB: delta_industries
    volumes:
      - pgdata:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.13.0
    container_name: delta-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: delta_meili_master_key
      MEILI_ENV: development
    volumes:
      - msdata:/meili_data

volumes:
  pgdata:
  msdata:
