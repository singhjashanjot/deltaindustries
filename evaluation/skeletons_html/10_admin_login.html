<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skeleton Wireframe — 10 Admin Login</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Courier New', monospace; background: #f0f0f0; color: #444; }
.skeleton-page { max-width:1280px; margin:0 auto; background:#fff; min-height:100vh; position:relative; }
.skeleton-page::before { content:'SKELETON WIREFRAME — PLANNING STAGE'; display:block; background:#333; color:#fff; text-align:center; padding:4px 0; font-size:10px; letter-spacing:3px; position:sticky; top:0; z-index:9999; }
.block { border:2px dashed #bbb; background:#fafafa; position:relative; }
.block-label { position:absolute; top:2px; left:4px; font-size:9px; color:#999; background:rgba(255,255,255,0.9); padding:1px 4px; border:1px solid #ddd; }
.block-text { color:#ccc; font-size:13px; text-align:center; padding:20px; }
.block-dark { background:#e0e0e0; border-color:#999; }
.block-dark .block-label { color:#666; }
.note { background:#fffde7; border:1px dashed #f9a825; padding:8px 12px; margin:8px; font-size:10px; color:#666; border-radius:2px; }
.note::before { content:'📝 NOTE: '; font-weight:bold; color:#f9a825; }
.arrow-annotate { position:absolute; font-size:9px; color:#e91e63; font-weight:bold; }
.arrow-annotate::before { content:'← '; }
img-placeholder { display:flex; align-items:center; justify-content:center; background:#eee; border:1px dashed #ccc; color:#ccc; font-size:11px; }
img-placeholder::before { content:'[ IMG ]'; }
.btn-placeholder { display:inline-flex; align-items:center; justify-content:center; background:#ddd; border:2px dashed #aaa; padding:8px 20px; color:#999; font-size:12px; font-weight:bold; }
.input-placeholder { display:block; background:#f5f5f5; border:2px dashed #ccc; padding:10px 12px; width:100%; color:#ccc; font-size:12px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.grid-4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px; }
.flex-row { display:flex; gap:12px; align-items:center; }
.flex-col { display:flex; flex-direction:column; gap:8px; }
.chip { display:inline-block; padding:6px 16px; border:2px dashed #bbb; border-radius:20px; font-size:11px; color:#aaa; background:#fafafa; }
.chip.active { background:#ddd; border-color:#999; color:#666; font-weight:bold; }
.card { border:2px dashed #ccc; background:#fafafa; overflow:hidden; }
.card .img-area { height:120px; background:#eee; border-bottom:1px dashed #ddd; display:flex; align-items:center; justify-content:center; color:#ccc; font-size:11px; }
.card .info { padding:10px; }
.card .tag { font-size:9px; color:#bbb; text-transform:uppercase; }
.card .name { font-size:13px; color:#ccc; margin:4px 0; }
.card .price { font-size:11px; color:#ddd; }
</style>
</head>
<body>
<div class="skeleton-page">

<div style="background:#ddd; min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <span class="block-label" style="position:fixed;top:4px;left:4px;">Admin Login — AdminLogin.tsx</span>
  <div class="card" style="width:400px; padding:40px; background:#fafafa;">
    <div style="text-align:center; margin-bottom:24px;">
      <div style="width:48px;height:48px;border-radius:50%;border:2px dashed #bbb;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:#bbb;">&#9878;</div>
      <div style="color:#ccc;font-size:18px;font-weight:bold;">Delta Admin</div>
    </div>
    <div class="flex-col" style="gap:16px;">
      <div><div style="color:#ccc;font-size:10px;margin-bottom:4px;">Email</div><div class="input-placeholder">admin@deltaindustries.in</div></div>
      <div><div style="color:#ccc;font-size:10px;margin-bottom:4px;">Password</div><div class="input-placeholder">&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;</div></div>
      <div class="btn-placeholder" style="width:100%;text-align:center;padding:14px;">Sign In</div>
    </div>
    <div class="note" style="margin-top:16px;">Full-screen dark maroon (#35020D) background. trpc.admin.login.useMutation. Sets session cookie. Auto-redirect via trpc.admin.me.useQuery if already authenticated.</div>
  </div>
</div>

</div>
</body>
</html>
