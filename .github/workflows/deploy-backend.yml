name: Deploy Backend to Deno Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'prisma/**'
      - 'deno.json'
      - 'deno.lock'
      - 'seed-deno.ts'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Deploy to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: ${{ secrets.DENOPROJECTID }}
          entrypoint: server/deno-deploy.ts
